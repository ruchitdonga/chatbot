# Store questions the assistant answers itself (FeastFleet is a fictional brand). The NLU model (MASSIVE) has no
# intents for these, so rasa/components/feastfleet_nlu.py detects them by keyword, checked in the order below; the
# first topic with a match wins. Keywords are lowercase substrings; short Latin words (5 letters or fewer) must
# match a whole word. AI-written for ten languages and not reviewed by native speakers (decision 2026-11-17).
# Never applied when the message contains a complaint word (below): complaints keep going to a person. It does
# override the model's out_of_scope/general_quirky, because the out-of-scope training data covered payment and
# allergy problems, so the model sends plain store questions ("how can I pay?") to a person too. Measured on the
# 110-item challenge set before adopting (PROJECT_STATUS.md).

