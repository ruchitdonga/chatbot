# Demo business the chatbot supports (decision 2026-11-16). FeastFleet is FICTIONAL: a student demo, not a real company.
# The NLU model is unchanged; this file decides what the bot answers itself and what goes to a human.

name: FeastFleet
fictional: true
description: Fictional food-delivery app used to demonstrate the multilingual support chatbot.

# MASSIVE intents the bot answers itself (with the mock backend).
answered_intents:
  - takeaway_order     # order food
  - takeaway_query     # ask about an order
  - general_greet
# datetime_query and weather_query removed (user, 2026-11-17): not a food-delivery job, so they get
# "I can't help with that here" like other MASSIVE intents. Store questions (fees, payment, menu) are FAQ intents
# detected by keyword in the NLU component (configs/faq.yaml).

# Any other MASSIVE intent gets a polite "I can't help with that here" (no handoff).
# Predicted out_of_scope, or low confidence, goes to a human agent.

# MASSIVE's catch-all intent: reply "I can't help with that here - shall I connect you to an agent?" and hand off
# if the user agrees (decision 2026-11-16). Chosen after inspecting held-out challenge misses, so the model-level
# NFR-3 figure (90.9%) is reported unchanged and this system-level rule is reported separately.
offer_handoff_intents:
  - general_quirky

# Answered even when the energy rule says low_confidence (decision 2026-11-16, Phase 9): every greeting tested
# ("hello", "bonjour", "guten morgen", ...) is predicted general_greet but falls below the threshold, so the bot
# handed plain greetings to a human. Only the low_confidence reason is overridden (never out_of_scope, empty or
# unsupported language). Dialogue-level rule; the model-level NFR-3 result is unchanged.
# Decision (user, 2026-11-17): ordering and tracking added. Measured first: scripted task completion 69% -> 83%,
# turns 80% -> 89%, and none of the 55 held-out out-of-scope challenge items changes (still 50/55 handed off).
# Low risk because ordering only adds a dish to the cart (the customer checks out) and tracking only reads status.
low_confidence_exempt_intents:
  - general_greet
  - takeaway_order
  - takeaway_query
handoff_topics:
  - missing items
  - wrong order
  - food quality
  - rider behaviour
  - money back
  - payment problems
  - cancellations
  - account and address
  - allergies and food safety
  - complaints and requests for a person
