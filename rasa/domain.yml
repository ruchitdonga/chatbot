version: "3.1"
# FeastFleet is a FICTIONAL food-delivery brand. Orders go to the FeastFleet orders API (src/shop/app.py, in memory).
# Replies: English default plus one conditional variation per locale, keyed on the `language` slot (FR-4).
# Translations were machine-written by an AI assistant and are NOT reviewed by native speakers.
# utter_disclosure must match configs/disclosure.yaml (tests/test_rasa_domain.py checks this).

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false

intents:
  - takeaway_order
  - takeaway_query
  - general_greet
  - datetime_query
  - weather_query
  - general_quirky
  - out_of_scope
  - unsupported_request
  - nlu_fallback
  - affirm
  - deny

entities:
  - food_type
  - order_id  # an FF-#### number found in the message (rasa/components/feastfleet_nlu.py)

slots:
  language:
    type: text
    influence_conversation: false
    mappings:
      - type: custom  # action_validate_slot_mappings: first detected locale, then sticky
  food_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: food_type
        intent: takeaway_order
      # While the form asks, accept a tagged food from any intent (short answers like "pizza" are low-confidence).
      # Not from_text: "let me talk to a real person" was once taken as the food and ordered (Phase 9 eval).
      - type: from_entity
        entity: food_type
        not_intent: [out_of_scope]
        conditions:
          - active_loop: takeaway_order_form
            requested_slot: food_type
  order_id:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: order_id
      - type: from_text
        not_intent: [out_of_scope]
        conditions:
          - active_loop: takeaway_query_form
            requested_slot: order_id

forms:
  takeaway_order_form:
    required_slots: [food_type]
  takeaway_query_form:
    required_slots: [order_id]

actions:
  - action_add_to_cart
  - action_check_order
  - action_tell_time
  - action_validate_slot_mappings

responses:
  utter_disclosure:
  - text: "Hello! I am an AI assistant, not a human. If I can't help you, I will connect you to a person."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "¡Hola! Soy un asistente de inteligencia artificial, no una persona. Si no puedo ayudarte, te pondré en contacto con una persona."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Hallo! Ich bin ein KI-Assistent, kein Mensch. Wenn ich Ihnen nicht helfen kann, verbinde ich Sie mit einer Person."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Bonjour ! Je suis un assistant d'intelligence artificielle, pas un humain. Si je ne peux pas vous aider, je vous mettrai en relation avec une personne."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "こんにちは！私はAIアシスタントで、人間ではありません。お手伝いできない場合は、担当者におつなぎします。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "नमस्ते! मैं एक एआई सहायक हूँ, इंसान नहीं। अगर मैं आपकी मदद नहीं कर पाया, तो मैं आपको किसी व्यक्ति से जोड़ दूँगा।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "مرحبًا! أنا مساعد ذكاء اصطناعي ولست إنسانًا. إذا لم أتمكن من مساعدتك، فسأحوّلك إلى موظف بشري."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Habari! Mimi ni msaidizi wa akili bandia (AI), si binadamu. Nisipoweza kukusaidia, nitakuunganisha na mtu."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ሰላም! እኔ የሰው ሰራሽ አስተውሎት (AI) ረዳት ነኝ፣ ሰው አይደለሁም። ልረዳዎት ካልቻልኩ ከሰው ጋር አገናኝዎታለሁ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "வணக்கம்! நான் ஒரு செயற்கை நுண்ணறிவு (AI) உதவியாளர், மனிதர் அல்ல. என்னால் உதவ முடியாவிட்டால், உங்களை ஒரு நபருடன் இணைப்பேன்."}

  utter_greet:
  - text: "Hi! I can help you order food or check on an order."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "¡Hola! Puedo ayudarte a pedir comida o a consultar un pedido."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Hallo! Ich kann Ihnen helfen, Essen zu bestellen oder eine Bestellung zu prüfen."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Bonjour ! Je peux vous aider à commander à manger ou à suivre une commande."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "こんにちは！料理の注文や注文状況の確認をお手伝いします。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "नमस्ते! मैं खाना ऑर्डर करने या किसी ऑर्डर की स्थिति जानने में आपकी मदद कर सकता हूँ।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "مرحبًا! يمكنني مساعدتك في طلب الطعام أو متابعة طلب."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Habari! Ninaweza kukusaidia kuagiza chakula au kufuatilia oda."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ሰላም! ምግብ እንዲያዝዙ ወይም ትዕዛዝዎን እንዲከታተሉ ልረዳዎት እችላለሁ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "வணக்கம்! உணவு ஆர்டர் செய்யவோ ஒரு ஆர்டரின் நிலையை அறியவோ நான் உதவ முடியும்."}

  utter_ask_food_type:
  - text: "What would you like to order?"
  - {condition: [{type: slot, name: language, value: es-ES}], text: "¿Qué te gustaría pedir?"}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Was möchten Sie bestellen?"}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Que souhaitez-vous commander ?"}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "何を注文しますか？"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "आप क्या ऑर्डर करना चाहेंगे?"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "ماذا تريد أن تطلب؟"}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Ungependa kuagiza nini?"}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ምን ማዘዝ ይፈልጋሉ?"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "நீங்கள் என்ன ஆர்டர் செய்ய விரும்புகிறீர்கள்?"}

  utter_added_to_cart:
  - text: "Added {dish} to your cart. Check out when you're ready and pay by card or cash on delivery."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "He añadido {dish} a tu carrito. Cuando quieras, finaliza el pedido y paga con tarjeta o en efectivo al recibirlo."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "{dish} liegt jetzt in Ihrem Warenkorb. Schließen Sie die Bestellung ab und zahlen Sie per Karte oder bar bei Lieferung."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "J'ai ajouté {dish} à votre panier. Validez la commande quand vous voulez et payez par carte ou en espèces à la livraison."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "{dish}をカートに追加しました。準備ができたらお会計へ進み、カードまたは代金引換でお支払いください。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "{dish} आपकी कार्ट में जोड़ दिया गया है। तैयार हों तो चेकआउट करें और कार्ड या कैश ऑन डिलीवरी से भुगतान करें।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "أضفت {dish} إلى سلتك. أكمل الطلب عندما تكون جاهزًا وادفع بالبطاقة أو نقدًا عند الاستلام."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Nimeongeza {dish} kwenye kikapu chako. Ukiwa tayari, kamilisha oda na ulipe kwa kadi au pesa taslimu wakati wa kupokea."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "{dish} ወደ ጋሪዎ ታክሏል። ሲዘጋጁ ትዕዛዙን ያጠናቅቁ፤ በካርድ ወይም ሲደርስ በጥሬ ገንዘብ ይክፈሉ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "{dish} உங்கள் கார்ட்டில் சேர்க்கப்பட்டது. தயாரானதும் செக்அவுட் செய்து கார்டு அல்லது டெலிவரியின் போது பணமாகச் செலுத்துங்கள்."}

  utter_not_on_menu:
  - text: "Sorry, {food_type} isn't on our menu. Tell me another dish, or browse the menu."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "Lo siento, {food_type} no está en nuestro menú. Dime otro plato o mira el menú."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Entschuldigung, {food_type} steht nicht auf unserer Karte. Nennen Sie ein anderes Gericht oder sehen Sie sich die Karte an."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Désolé, {food_type} n'est pas sur notre carte. Proposez un autre plat ou consultez la carte."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "申し訳ありません、{food_type}はメニューにありません。別の料理を教えていただくか、メニューをご覧ください。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "माफ़ कीजिए, {food_type} हमारे मेन्यू में नहीं है। कोई और डिश बताइए या मेन्यू देखिए।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "عذرًا، {food_type} ليس في قائمتنا. اذكر طبقًا آخر أو تصفّح القائمة."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Samahani, {food_type} haipo kwenye menyu yetu. Niambie chakula kingine, au angalia menyu."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ይቅርታ፣ {food_type} በምናሌያችን ላይ የለም። ሌላ ምግብ ይንገሩኝ ወይም ምናሌውን ይመልከቱ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "மன்னிக்கவும், {food_type} எங்கள் மெனுவில் இல்லை. வேறு உணவைச் சொல்லுங்கள் அல்லது மெனுவைப் பாருங்கள்."}

  utter_ask_order_id:
  - text: "What is your order number? It looks like FF-1001."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "¿Cuál es tu número de pedido? Tiene este formato: FF-1001."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Wie lautet Ihre Bestellnummer? Sie sieht so aus: FF-1001."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Quel est votre numéro de commande ? Il ressemble à FF-1001."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "注文番号を教えてください。FF-1001 のような形式です。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "आपका ऑर्डर नंबर क्या है? यह FF-1001 जैसा दिखता है।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "ما رقم طلبك؟ يكون بهذا الشكل: FF-1001."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Nambari yako ya oda ni ipi? Inafanana na FF-1001."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "የትዕዛዝ ቁጥርዎ ስንት ነው? እንደ FF-1001 ያለ ነው።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "உங்கள் ஆர்டர் எண் என்ன? அது FF-1001 போல இருக்கும்."}

  utter_order_status:
  - text: "Order {order_id} should be with you in about {eta} minutes."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "El pedido {order_id} debería llegar en unos {eta} minutos."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Bestellung {order_id} sollte in etwa {eta} Minuten bei Ihnen sein."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "La commande {order_id} devrait arriver dans environ {eta} minutes."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "注文 {order_id} は約{eta}分でお届けの予定です。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "ऑर्डर {order_id} लगभग {eta} मिनट में आप तक पहुँच जाना चाहिए।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "من المتوقع أن يصلك الطلب {order_id} خلال {eta} دقيقة تقريبًا."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Oda {order_id} inatarajiwa kukufikia baada ya takriban dakika {eta}."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ትዕዛዝ {order_id} በግምት በ{eta} ደቂቃ ውስጥ ይደርስዎታል።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "ஆர்டர் {order_id} சுமார் {eta} நிமிடங்களில் உங்களை வந்தடையும்."}

  utter_order_delivered:
  - text: "Order {order_id} is complete. Enjoy your meal!"
  - {condition: [{type: slot, name: language, value: es-ES}], text: "El pedido {order_id} está completado. ¡Que aproveche!"}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Bestellung {order_id} ist abgeschlossen. Guten Appetit!"}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "La commande {order_id} est terminée. Bon appétit !"}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "注文 {order_id} は完了しました。どうぞお召し上がりください！"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "ऑर्डर {order_id} पूरा हो गया है। खाने का आनंद लें!"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "اكتمل الطلب {order_id}. بالهناء والشفاء!"}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Oda {order_id} imekamilika. Furahia mlo wako!"}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ትዕዛዝ {order_id} ተጠናቋል። መልካም ምግብ!"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "ஆர்டர் {order_id} முடிந்தது. உணவை ரசியுங்கள்!"}

  utter_order_not_found:
  - text: "I couldn't find that order. I'll connect you to a human agent."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "No he encontrado ese pedido. Te pondré en contacto con un agente humano."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Ich konnte diese Bestellung nicht finden. Ich verbinde Sie mit einem Mitarbeiter."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Je n'ai pas trouvé cette commande. Je vous mets en relation avec un conseiller."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "その注文が見つかりませんでした。担当者におつなぎします。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "मुझे वह ऑर्डर नहीं मिला। मैं आपको एक मानव एजेंट से जोड़ रहा हूँ।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "لم أتمكن من العثور على هذا الطلب. سأحوّلك إلى موظف بشري."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Sikuweza kupata oda hiyo. Nitakuunganisha na wakala wa kibinadamu."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ያንን ትዕዛዝ ማግኘት አልቻልኩም። ከሰው ወኪል ጋር አገናኝዎታለሁ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "அந்த ஆர்டரை என்னால் கண்டுபிடிக்க முடியவில்லை. உங்களை ஒரு மனித முகவருடன் இணைக்கிறேன்."}

  utter_cant_help:
  - text: "Sorry, I can't help with that here. I can take food orders and check on orders."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "Lo siento, no puedo ayudarte con eso aquí. Puedo tomar pedidos de comida y consultar pedidos."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Entschuldigung, dabei kann ich hier nicht helfen. Ich kann Essensbestellungen aufnehmen und Bestellungen prüfen."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Désolé, je ne peux pas vous aider pour cela ici. Je peux prendre des commandes de repas et suivre des commandes."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "申し訳ありませんが、ここではそのご要望にお応えできません。料理の注文と注文状況の確認ができます。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "माफ़ कीजिए, मैं यहाँ इसमें मदद नहीं कर सकता। मैं खाने के ऑर्डर ले सकता हूँ और ऑर्डर की स्थिति बता सकता हूँ।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "عذرًا، لا يمكنني المساعدة في ذلك هنا. يمكنني استلام طلبات الطعام ومتابعة الطلبات."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Samahani, siwezi kukusaidia na hilo hapa. Ninaweza kupokea oda za chakula na kufuatilia oda."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ይቅርታ፣ እዚህ በዚህ ልረዳዎት አልችልም። የምግብ ትዕዛዝ መቀበል እና ትዕዛዞችን መከታተል እችላለሁ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "மன்னிக்கவும், இங்கே அதற்கு என்னால் உதவ முடியாது. நான் உணவு ஆர்டர்களை எடுக்கவும் ஆர்டர்களின் நிலையைப் பார்க்கவும் முடியும்."}

  utter_offer_handoff:
  - text: "Sorry, I can't help with that here. Shall I connect you to a human agent?"
    buttons: [{title: "Yes", payload: /affirm}, {title: "No", payload: /deny}]
  - {condition: [{type: slot, name: language, value: es-ES}], text: "Lo siento, no puedo ayudarte con eso aquí. ¿Quieres que te ponga en contacto con un agente humano?", buttons: [{title: "Sí", payload: /affirm}, {title: "No", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Entschuldigung, dabei kann ich hier nicht helfen. Soll ich Sie mit einem Mitarbeiter verbinden?", buttons: [{title: "Ja", payload: /affirm}, {title: "Nein", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Désolé, je ne peux pas vous aider pour cela ici. Voulez-vous que je vous mette en relation avec un conseiller ?", buttons: [{title: "Oui", payload: /affirm}, {title: "Non", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "申し訳ありませんが、ここではそのご要望にお応えできません。担当者におつなぎしましょうか？", buttons: [{title: "はい", payload: /affirm}, {title: "いいえ", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "माफ़ कीजिए, मैं यहाँ इसमें मदद नहीं कर सकता। क्या मैं आपको किसी मानव एजेंट से जोड़ दूँ?", buttons: [{title: "हाँ", payload: /affirm}, {title: "नहीं", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "عذرًا، لا يمكنني المساعدة في ذلك هنا. هل تريد أن أحوّلك إلى موظف بشري؟", buttons: [{title: "نعم", payload: /affirm}, {title: "لا", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Samahani, siwezi kukusaidia na hilo hapa. Je, nikuunganishe na wakala wa kibinadamu?", buttons: [{title: "Ndiyo", payload: /affirm}, {title: "Hapana", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ይቅርታ፣ እዚህ በዚህ ልረዳዎት አልችልም። ከሰው ወኪል ጋር ላገናኝዎት?", buttons: [{title: "አዎ", payload: /affirm}, {title: "አይ", payload: /deny}]}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "மன்னிக்கவும், இங்கே அதற்கு என்னால் உதவ முடியாது. உங்களை ஒரு மனித முகவருடன் இணைக்கட்டுமா?", buttons: [{title: "ஆம்", payload: /affirm}, {title: "இல்லை", payload: /deny}]}

  utter_handoff:
  - text: "I'm connecting you to a human agent now."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "Te estoy poniendo en contacto con un agente humano."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Ich verbinde Sie jetzt mit einem Mitarbeiter."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Je vous mets en relation avec un conseiller."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "ただいま担当者におつなぎします。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "मैं अभी आपको एक मानव एजेंट से जोड़ रहा हूँ।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "سأحوّلك الآن إلى موظف بشري."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Ninakuunganisha na wakala wa kibinadamu sasa."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "አሁን ከሰው ወኪል ጋር አገናኝዎታለሁ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "இப்போது உங்களை ஒரு மனித முகவருடன் இணைக்கிறேன்."}

  utter_anything_else:
  - text: "OK. Is there anything else I can help with?"
  - {condition: [{type: slot, name: language, value: es-ES}], text: "De acuerdo. ¿Puedo ayudarte con algo más?"}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "In Ordnung. Kann ich sonst noch helfen?"}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "D'accord. Puis-je vous aider pour autre chose ?"}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "承知しました。ほかにお手伝いできることはありますか？"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "ठीक है। क्या मैं और किसी चीज़ में मदद कर सकता हूँ?"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "حسنًا. هل هناك شيء آخر يمكنني مساعدتك فيه؟"}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Sawa. Kuna kitu kingine ninachoweza kukusaidia?"}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "እሺ። ሌላ ልረዳዎት የምችለው ነገር አለ?"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "சரி. வேறு ஏதாவது உதவி வேண்டுமா?"}

  utter_time:
  - text: "It is {time} UTC."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "Son las {time} UTC."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Es ist {time} Uhr UTC."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Il est {time} UTC."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "現在 {time}（UTC）です。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "अभी {time} UTC बजे हैं।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "الساعة الآن {time} بالتوقيت العالمي (UTC)."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Sasa ni saa {time} UTC."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "አሁን ሰዓቱ {time} UTC ነው።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "இப்போது நேரம் {time} UTC."}

  utter_weather:
  - text: "Sorry, I can't check the weather here. I can help you order food or check on an order."
  - {condition: [{type: slot, name: language, value: es-ES}], text: "Lo siento, aquí no puedo consultar el tiempo. Puedo ayudarte a pedir comida o a consultar un pedido."}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Entschuldigung, das Wetter kann ich hier nicht abfragen. Ich kann Ihnen beim Bestellen oder bei einer Bestellung helfen."}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Désolé, je ne peux pas consulter la météo ici. Je peux vous aider à commander ou à suivre une commande."}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "申し訳ありませんが、ここでは天気を確認できません。料理の注文や注文状況の確認をお手伝いします。"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "माफ़ कीजिए, मैं यहाँ मौसम की जानकारी नहीं दे सकता। मैं खाना ऑर्डर करने या ऑर्डर की स्थिति जानने में मदद कर सकता हूँ।"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "عذرًا، لا يمكنني معرفة حالة الطقس هنا. يمكنني مساعدتك في طلب الطعام أو متابعة طلب."}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Samahani, siwezi kuangalia hali ya hewa hapa. Ninaweza kukusaidia kuagiza chakula au kufuatilia oda."}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ይቅርታ፣ እዚህ የአየር ሁኔታን ማየት አልችልም። ምግብ እንዲያዝዙ ወይም ትዕዛዝ እንዲከታተሉ ልረዳዎት እችላለሁ።"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "மன்னிக்கவும், இங்கே வானிலையைப் பார்க்க முடியாது. உணவு ஆர்டர் செய்யவோ ஆர்டரின் நிலையை அறியவோ உதவ முடியும்."}

  utter_default:
  - text: "Sorry, I didn't understand. Could you say that another way?"
  - {condition: [{type: slot, name: language, value: es-ES}], text: "Lo siento, no lo he entendido. ¿Puedes decirlo de otra forma?"}
  - {condition: [{type: slot, name: language, value: de-DE}], text: "Entschuldigung, das habe ich nicht verstanden. Können Sie es anders formulieren?"}
  - {condition: [{type: slot, name: language, value: fr-FR}], text: "Désolé, je n'ai pas compris. Pouvez-vous reformuler ?"}
  - {condition: [{type: slot, name: language, value: ja-JP}], text: "申し訳ありません、よく分かりませんでした。別の言い方でお願いできますか？"}
  - {condition: [{type: slot, name: language, value: hi-IN}], text: "माफ़ कीजिए, मैं समझ नहीं पाया। क्या आप इसे दूसरे तरीके से कह सकते हैं?"}
  - {condition: [{type: slot, name: language, value: ar-SA}], text: "عذرًا، لم أفهم. هل يمكنك قولها بطريقة أخرى؟"}
  - {condition: [{type: slot, name: language, value: sw-KE}], text: "Samahani, sikuelewa. Unaweza kusema kwa njia nyingine?"}
  - {condition: [{type: slot, name: language, value: am-ET}], text: "ይቅርታ፣ አልገባኝም። በሌላ መንገድ ሊገልጹት ይችላሉ?"}
  - {condition: [{type: slot, name: language, value: ta-IN}], text: "மன்னிக்கவும், எனக்குப் புரியவில்லை. வேறு விதமாகச் சொல்ல முடியுமா?"}
