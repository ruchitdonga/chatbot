# Phase 9 scripted conversations for the FICTIONAL FeastFleet demo (src/dialogue/evaluate.py).
# Authored 2026-11-16 BEFORE running them against the model (none were probed), so failures are genuine.
# Non-English sentences were written by an AI assistant and are unreviewed.
#
# locale: the language the replies should be in (null = unsupported language, only the handoff is checked).
# hint:   optional client language hint sent as REST metadata on every turn.
# expect: the bot replies (response names without "utter_") for that turn, in order, excluding the disclosure,
#         which is checked separately on the first turn.

conversations:

# ---------------- en-US ----------------
- {id: en-order-full, locale: en-US, goal: order, turns: [{user: "can i get a large pepperoni pizza delivered", expect: [order_placed]}]}
