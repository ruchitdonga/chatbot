# FICTIONAL FeastFleet demo: the whole stack (NLU service, Rasa, action server with mock backend).
#   docker compose up --build        then POST http://localhost:5005/webhooks/rest/webhook
#   {"sender": "me", "message": "quiero pedir una pizza"}   (optional "metadata": {"language": "sw-KE"})
# Needs the model files on the host (git-ignored, never baked into images):
#   artifacts/onnx/xlm-roberta-base-runB-oos/  (python -m src.models.export_onnx)   artifacts/models/lid.176.bin
# Rasa test:  docker compose run --rm rasa test core --e2e --stories tests --out results
# Ports are bound to localhost only: none of the services has authentication.
services:
  nlu:
    build:
      context: .
      dockerfile: docker/Dockerfile.nlu
    image: feastfleet-nlu:phase10
    volumes:
      - ./artifacts/onnx:/app/artifacts/onnx:ro
      - ./artifacts/models:/app/artifacts/models:ro
      - ./logs:/app/logs  # allow-listed event log only (no text, no slot values)
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s  # loading the 1.1 GB fp32 model from a bind mount

  actions:
    build:
      context: .
      dockerfile: docker/Dockerfile.actions
    image: feastfleet-actions:phase10

  rasa:
    image: rasa/rasa:3.6.21-full
    working_dir: /app
    volumes:
      - ./rasa:/app
      - ./configs:/configs:ro
    environment:
      RASA_TELEMETRY_ENABLED: "false"
    # Train first (no-op when nothing changed): trained models are git-ignored, so a clean checkout has none.
    entrypoint: ["sh", "-c", "rasa train --quiet && exec rasa \"$$@\"", "--"]
    command: ["run"]
    ports:
      - "127.0.0.1:5005:5005"
    depends_on:
      nlu:
        condition: service_healthy
      actions:
        condition: service_started
