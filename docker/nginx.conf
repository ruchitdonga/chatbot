# FeastFleet demo site (fictional business): static page + proxy to Rasa's REST channel (same origin, no CORS).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Only the REST channel is exposed; Rasa's model/tracker API stays unreachable from the page.
    location = /webhooks/rest/webhook {
        proxy_pass http://rasa:5005;
        proxy_read_timeout 30s;
        client_max_body_size 8k;
    }

    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log off;  # access logs would record nothing sensitive, but the demo keeps no logs it does not need
}
